name: Windows build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -r requirements.txt -r web/requirements.txt httpx pytest
      - run: python -m pytest -q tests
        env:
          QT_QPA_PLATFORM: offscreen

  windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write   # v* teglarida GitHub Release yaratish uchun
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller pytest
      - name: Testlar (Windows)
        run: python -m pytest -q tests
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Versiya
        id: ver
        shell: bash
        run: echo "version=$(python -c 'import ttysi_cadastre as t; print(t.__version__)')" >> "$GITHUB_OUTPUT"
      - name: Dastur kodi arxivi (yangilanadigan qism)
        shell: pwsh
        env:
          NOTES: ${{ github.event.head_commit.message }}
        run: python tools/release.py app --notes "$env:NOTES"
      - name: .exe yig'ish
        run: pyinstaller --noconfirm build.spec
      - name: Yig'ilgan .exe ni sinash (--self-test)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          TTYSI_UPDATES_DIR: ${{ runner.temp }}\no_updates
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'selftest.json'
          $p = Start-Process -FilePath 'dist\TTYSI_Kadastr\TTYSI_Kadastr.exe' -ArgumentList '--self-test', $out -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "self-test chiqish kodi: $($p.ExitCode)" }
          $j = Get-Content $out | ConvertFrom-Json
          Write-Host "Versiya: $($j.version)  Manba: $($j.source)"
          if ($j.version -ne '${{ steps.ver.outputs.version }}') { throw "Versiya mos emas" }
          if ($j.source -notlike '*app\ttysi_cadastre.zip') { throw "Kod zip'dan yuklanmadi" }
      - name: Arxivlash va yangilanish fayllari
        shell: pwsh
        env:
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          Compress-Archive -Path dist/TTYSI_Kadastr -DestinationPath TTYSI_Kadastr_Windows.zip
          python tools/release.py publish release --full TTYSI_Kadastr_Windows.zip --notes "$env:NOTES"
      - uses: actions/upload-artifact@v4
        with:
          name: TTYSI_Kadastr_Windows
          path: release/*
      - name: Reliz (v* teg yoki [release] commit)
        # v* tegida yoki commit xabarida [release] bo'lsa - teg va relizni GitHub o'zi yaratadi
        if: startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[release]')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          target_commitish: ${{ github.sha }}
          name: TTYSI Binolar kadastri ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          body: |
            Windows uchun tayyor dastur.

            **Birinchi o'rnatish:** `TTYSI_Kadastr_Windows.zip` ni yuklab oling, arxivni oching
            va `TTYSI_Kadastr\TTYSI_Kadastr.exe` ni ishga tushiring. Internet kerak emas.

            **Yangilash:** o'rnatilgan dastur o'zi yangilanadi (Yordam → Yangilanishni tekshirish).
            `update.json` va `ttysi_app-*.zip` - yangilanish fayllari; tarmoq papkasidan yangilash
            uchun bu uch faylni papkaga ko'chiring.
