<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F5FAD">
<title>TTYSI Binolar kadastri</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <button class="logo" id="home" aria-label="Bosh sahifa">AT</button>
  <div class="crumbs" id="crumbs">TTYSI Binolar kadastri</div>
  <span class="ver" id="ver"></span>
  <button class="user" id="user" hidden></button>
</header>
<div class="menu" id="user-menu" hidden>
  <div class="muted" id="user-role"></div>
  <a href="#/users" id="menu-users" hidden>Foydalanuvchilar</a>
  <a href="#/journal" id="menu-journal" hidden>O'zgarishlar jurnali</a>
  <button id="logout">Chiqish</button>
</div>

<main id="view-home" class="page">
  <div class="home-head">
    <h1>Binolar</h1>
    <input id="search" type="search" placeholder="Bino yoki tashkilot qidirish" autocomplete="off">
  </div>
  <div id="tree"></div>
</main>

<main id="view-building" class="page" hidden>
  <nav class="floors" id="floors" aria-label="Etajlar"></nav>
  <div class="work">
    <section class="plan-wrap" id="plan-wrap">
      <svg id="plan" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Etaj chizmasi"></svg>
      <div class="plan-tools">
        <button id="fit" title="Butun chizma">⤢</button>
        <button id="zin" title="Kattalashtirish">+</button>
        <button id="zout" title="Kichiklashtirish">−</button>
        <label class="bgtoggle"><input type="checkbox" id="bg"> Fon</label>
      </div>
      <div class="hint" id="hint"></div>
    </section>
    <aside class="side" id="side">
      <div class="palette" id="palette"></div>
      <label class="plan-mode"><input type="checkbox" id="planned"> Kerak (reja)</label>
      <button class="next" id="next" hidden></button>
      <div class="stats" id="stats"></div>
      <a class="report" id="report" download>Excel hisobot</a>
      <div class="journal" id="b-journal"></div>
    </aside>
  </div>
</main>

<main id="view-users" class="page list-page" hidden>
  <h1>Foydalanuvchilar</h1>
  <p class="muted">Ko'ruvchi — faqat ko'radi va hisobot oladi. Tahrirlovchi — AT belgilarini kiritadi.
    Administrator — hammasi va foydalanuvchilarni boshqaradi.</p>
  <table class="tbl" id="users-tbl"></table>
  <form class="user-form" id="user-form">
    <b id="uf-title">Yangi foydalanuvchi</b>
    <input id="uf-login" placeholder="Login (masalan: aziz)" autocomplete="off" required>
    <input id="uf-name" placeholder="Ism familiya (ixtiyoriy)" autocomplete="off">
    <select id="uf-role"></select>
    <input id="uf-pass" type="password" placeholder="Parol (kamida 6 belgi)" autocomplete="new-password">
    <div class="sheet-row"><button class="primary">Saqlash</button><button type="button" id="uf-new">Yangi</button></div>
    <div class="err" id="uf-err"></div>
  </form>
</main>

<main id="view-journal" class="page list-page" hidden>
  <h1>O'zgarishlar jurnali</h1>
  <div id="journal-list"></div>
</main>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-card">
    <div class="sheet-head"><b id="sheet-title"></b><button id="sheet-close" aria-label="Yopish">✕</button></div>
    <div class="sheet-room" id="sheet-room"></div>
    <div class="sheet-types" id="sheet-types"></div>
    <div class="sheet-row">
      <label><input type="radio" name="st" value="existing"> Mavjud</label>
      <label><input type="radio" name="st" value="planned"> Kerak (reja)</label>
    </div>
    <input id="sheet-note" placeholder="Izoh (ixtiyoriy)" maxlength="500">
    <div class="sheet-row end">
      <button class="danger" id="sheet-del">O'chirish</button>
      <button class="primary" id="sheet-save">Saqlash</button>
    </div>
  </div>
</div>

<div class="login" id="login" hidden>
  <form class="sheet-card" id="login-form">
    <b id="login-title">Kirish</b>
    <p class="muted" id="login-note"></p>
    <input id="lg-login" placeholder="Login" autocomplete="username" autocapitalize="none">
    <input id="lg-name" placeholder="Ism familiya (ixtiyoriy)" hidden>
    <input id="pin" type="password" autocomplete="current-password" placeholder="Parol">
    <button class="primary" id="login-btn">Kirish</button>
    <div class="err" id="login-err"></div>
  </form>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module" src="/static/app.js"></script>
</body>
</html>
